<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="512" height="512" rx="128" fill="#07090E" />
  
  <!-- Outer Glowing Shield Outline -->
  <path d="M256 56 C340 56, 420 88, 420 88 C420 250, 360 380, 256 448 C152 380, 92 250, 92 88 C92 88, 172 56, 256 56 Z" 
        fill="url(#shieldGrad)" 
        opacity="0.15" />

  <path d="M256 72 C330 72, 400 100, 400 100 C400 242, 348 358, 256 420 C164 358, 112 242, 112 100 C112 100, 182 72, 256 72 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="20" 
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Lightning Bolt / Packet Flow Icon -->
  <path d="M276 130 L168 280 L244 280 L220 386 L348 232 L268 232 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" />
</svg>
